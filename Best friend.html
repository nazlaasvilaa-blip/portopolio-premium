<!DOCTYPE html>
<html lang="id">

<head>
<meta charset="UTF-8">
<title>Fotografi Saya</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:50px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

img{
width:100%;
height:250px;
object-fit:cover;
border-radius:20px;
transition:.5s;
}

img:hover{
transform:scale(1.05);
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
}

a{
color:#00d9ff;
text-decoration:none;
}

</style>

</head>

<body>
