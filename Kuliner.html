<!DOCTYPE html>
<html>

<head>

<title>Kuliner Saya</title>

<style>

body{
background:#0f172a;
color:white;
font-family:Arial;
padding:50px;
}

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
gap:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:20px;
}

img{
width:100%;
height:250px;
border-radius:20px;
object-fit:cover;
transition:.5s;
}

img:hover{
transform:scale(1.05);
}

a{
color:#00d9ff;
}

</style>

</head>

<body>

<h1>🍜 Makanan Favorit</h1>

<div class="gallery">

<div class="card">

<img src="dimsum.jpg">

<p>100/10</p>

</div>


<div class="card">

<img src="risol.jpg">

<p>1000/10</p>

</div>


<div class="card">

<img src="sate.jpg">

<p>999/10</p>

</div>




</div>

<br><br>

<a href="index.html">

⬅ Kembali ke halaman utama

</a>

</body>

</html>
