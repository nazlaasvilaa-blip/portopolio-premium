<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animasi Taman Sakura</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
overflow:hidden;
height:100vh;
background:linear-gradient(to bottom,#ffd6e8,#ffb7d5,#ffc9e3);
position:relative;
}

/* Matahari */

.sun{
position:absolute;
top:50px;
right:100px;
width:100px;
height:100px;
background:#fff3a3;
border-radius:50%;
box-shadow:0 0 60px #fff3a3;
}

/* Awan */

.cloud{
position:absolute;
background:white;
width:120px;
height:50px;
border-radius:50px;
animation:cloudMove 30s linear infinite;
}

.cloud::before{
content:"";
position:absolute;
width:60px;
height:60px;
background:white;
border-radius:50%;
top:-20px;
left:20px;
}

.cloud1{
top:100px;
left:-150px;
}

.cloud2{
top:180px;
left:-300px;
animation-duration:40s;
}

@keyframes cloudMove{
100%{
transform:translateX(1700px);
}
}

/* Rumput */

.grass{
position:absolute;
bottom:0;
width:100%;
height:180px;
background:#7cc576;
}

/* Pohon Sakura */

.tree{
position:absolute;
bottom:180px;
width:30px;
height:140px;
background:#6b3f25;
}

.tree::before{
content:"";
position:absolute;
width:120px;
height:120px;
background:#ff9ecf;
border-radius:50%;
left:-45px;
top:-80px;
box-shadow:
0 0 20px #ff9ecf;
}

.tree1{
left:150px;
}

.tree2{
right:180px;
}

/* Kelopak bunga jatuh */

.petal{
position:absolute;
top:-20px;
font-size:20px;
color:#ff69b4;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(0) rotate(0deg);
opacity:1;
}

100%{
transform:translateY(100vh) rotate(360deg);
opacity:0;
}
}

/* Judul */

.title{
position:absolute;
top:30px;
left:50%;
transform:translateX(-50%);
font-size:40px;
font-family:cursive;
color:white;
text-shadow:0 0 20px deeppink;
}

</style>
</head>
<body>

<div class="title">
🌸 Taman Sakura Aesthetic 🌸
</div>

<div class="sun"></div>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>

<div class="tree tree1"></div>
<div class="tree tree2"></div>

<div class="grass"></div>

<script>

for(let i=0;i<30;i++){

let petal=document.createElement("div");

petal.className="petal";

petal.innerHTML="🌸";

petal.style.left=Math.random()*window.innerWidth+"px";

petal.style.animationDuration=
(Math.random()*5+5)+"s";

petal.style.fontSize=
(Math.random()*15+15)+"px";

document.body.appendChild(petal);

}

</script>

</body>
</html>
